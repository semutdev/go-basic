root = "."
tmp_dir = "tmp"

[build]
cmd = "templ generate && go build -o ./tmp/main ./cmd/main.go"
bin = "./tmp/main"
include_ext = ["go", "templ"]
exclude_dir = ["tmp", "static", "scss"]
exclude_regex = ["_templ.go"]
delay = 500
stop_on_error = true

[log]
main_only = false

[misc]
clean_on_exit = true